services:
  metrics:
    image: golang:1.26-alpine
    profiles: ["grafana", "observability"]
    working_dir: /src
    command: ["go", "run", "./cmd/grafana-lab"]
    volumes:
      - .:/src:ro
    ports:
      - "127.0.0.1:${READ_RUN_METRICS_PORT:-8081}:8081"

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: ["grafana", "observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./labs/grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${READ_RUN_PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:13.2.0
    profiles: ["grafana", "observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ${READ_RUN_GRAFANA_STATE:-./.read-run-state/grafana}/provisioning:/etc/grafana/provisioning:ro
      - ${READ_RUN_GRAFANA_STATE:-./.read-run-state/grafana}/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${READ_RUN_GRAFANA_PORT:-3001}:3000"

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:${READ_RUN_JAEGER_PORT:-16686}:16686"
      - "127.0.0.1:${READ_RUN_OTLP_PORT:-4317}:4317"

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    profiles: ["pubsub"]
    ports:
      - "127.0.0.1:${READ_RUN_RABBIT_PORT:-5672}:5672"
      - "127.0.0.1:${READ_RUN_RABBIT_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  postgres:
    image: postgres:17.11-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: drillbox
      POSTGRES_PASSWORD: drillbox-local
      POSTGRES_DB: drillbox
    ports:
      - "127.0.0.1:${READ_RUN_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["object-storage"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: drillbox
      MINIO_ROOT_PASSWORD: drillbox-local
    ports:
      - "127.0.0.1:${READ_RUN_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${READ_RUN_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

volumes:
  grafana_data:
  prometheus_data:
  rabbitmq_data:
  postgres_data:
  minio_data:
